# Turtle release identity: the single source for every release number and id.
#
# Read by turtle/release/identity.android.gradle (Android application id and versionCode, applied by
# HOOKS.md #63) and by .github/workflows/turtle-release.yml (tag must be v<version>, versionCode must
# grow, turtle/docs/changelog.md must have a section for <version>). See turtle/docs/release.md.
#
# androidApplicationId is permanent once a release ships: changing it makes a new app on every phone.
# The debug and benchmark build types still add their .debug and .benchmark suffixes.
androidApplicationId=app.turtleplayer
# Turtle's own monotonic sequence, independent of upstream's versionCode. Raise it by 1 for every release.
androidVersionCode=1
# Turtle's own semantic version. Release builds pass it to Gradle as -PappVersion.
version=0.1.0
