name: Turtle upstream sync

# Opens a PR merging MetrolistGroup/Metrolist main into our main every day, so conflicts stay small
# and YouTube fixes reach users fast. The on-call engineer merges a clean, green PR the same day.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Fetch upstream and update the mirror branch
        run: |
          git remote add upstream https://github.com/MetrolistGroup/Metrolist.git
          git fetch upstream main
          git push origin upstream/main:refs/heads/upstream-mirror --force-with-lease
      - name: Merge into a sync branch
        id: merge
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          branch="sync/upstream-$(date -u +%Y%m%d)"
          git config user.name "turtle-sync-bot"
          git config user.email "turtle-sync-bot@users.noreply.github.com"
          git checkout -b "$branch"
          if git merge --no-edit upstream/main; then
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          else
            # Commit the conflict markers so the owner of the touched hook resolves them in the PR.
            git add -A && git commit --no-edit -m "chore(sync): merge upstream with conflicts"
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
          fi
          git push origin "$branch" --force-with-lease
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open the sync PR
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="chore(sync): merge upstream Metrolist $(date -u +%Y-%m-%d)"
          body="Daily upstream merge. Conflicts: ${{ steps.merge.outputs.conflicts }}. If conflicted, the owner of the touched hook in turtle/HOOKS.md resolves it."
          gh pr create --base main --head "${{ steps.merge.outputs.branch }}" --title "$title" --body "$body" \
            || echo "A PR for this branch already exists."
